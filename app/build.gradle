apply plugin: 'com.android.application'
//apply plugin: 'kotlin-kapt'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdk 36
    defaultConfig {
        applicationId "id.co.evolution.financefy"
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName "2.1.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    buildTypes {

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }

    buildFeatures {
        dataBinding = true
        buildConfig = true

    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'id.co.evolution.financefy'
    defaultConfig{
    buildConfigField 'String', 'VERSION_NAME', "\"${rootProject.appVersionName}\""
}
}
dependencies {
    // Google ML Kit
    def camerax_version = "1.3.1"

    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.10.0'
    implementation 'com.github.QuadFlask:colorpicker:0.0.15'
    // Google Play Services & Ads
    implementation 'com.google.android.gms:play-services-ads:22.6.0'
    implementation 'com.quickbirdstudios:opencv:4.5.3.0'
    // AndroidX & UI Core (Disesuaikan agar kompatibel dengan Kotlin 1.9)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.core:core-ktx:1.12.0'

    // Hilt & Dagger
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-android-compiler:2.60.1'

    // Jika masih menggunakan Dagger Android legasi:
    implementation 'com.google.dagger:dagger-android:2.60.1'
    implementation 'com.google.dagger:dagger-android-support:2.60.1'
    ksp 'com.google.dagger:dagger-android-processor:2.60.1'

    // Room Database (Menggunakan variabel roomVersion = '2.6.1' dari top-level)
    implementation "androidx.room:room-runtime:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"

    // Networking (Retrofit & OkHttp disamakan versinya)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // UI Components & Utilities
    implementation 'com.applandeo:material-calendar-view:1.9.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'de.hdodenhof:circleimageview:3.0.1'
    implementation 'com.github.vipulasri:timelineview:1.1.3'
    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.joeShuff:MonthAndYearPicker:1.3.0'
    implementation 'com.github.thomper:sweet-alert-dialog:v1.4.0'

    // Apache POI
    implementation 'org.apache.poi:poi:5.2.0'
    implementation 'org.apache.poi:poi-ooxml:5.2.0'

    // Local Jars
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

apply plugin: 'com.google.gms.google-services'